<style>
  :root{
    --paper:#FAFAF7; --ink:#15150F; --graphite:#55534C; --steel:#8B8A82; --hairline:#D6D3C8; --signal:#B3402A; --r:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:#EDEBE3; min-height:100vh; font-family:'Atlas',sans-serif; color:var(--ink);
    padding:24px 16px 48px; display:flex; justify-content:center;
  }
  #app{width:100%; max-width:400px; padding-bottom:76px;}
  .sticky-footer{
    position:fixed; bottom:0; left:0; right:0; background:var(--paper);
    border-top:1px solid var(--ink); padding:12px 16px; display:flex; justify-content:center;
  }
  .sticky-footer-inner{width:100%; max-width:400px;}
  .sticky-footer .btn{margin-top:0;}
  .card{
    background:var(--paper); border:1px solid var(--ink); border-radius:6px; padding:20px; min-height:60vh;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--steel);
    text-transform:uppercase; margin:0 0 10px;
  }
  .eyebrow.center{text-align:center;}
  h1.title{font-size:19px; font-weight:500; margin:0 0 4px;}
  p.sub{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--graphite); margin:0 0 16px;}
  .rule{border:none; border-top:1px solid var(--ink); margin:14px 0;}
  .field{margin-bottom:14px;}
  .field label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; color:var(--steel);
    text-transform:uppercase; display:block; margin-bottom:5px;
  }
  .field input, .field select{
    width:100%; border:1px solid var(--hairline); border-radius:var(--r); padding:10px;
    font-family:'Atlas',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
  }
  .btn{
    width:100%; border:none; border-radius:var(--r); padding:12px; margin-top:6px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-secondary{background:var(--paper); color:var(--ink); border:1px solid var(--ink);}
  .btn-tertiary{background:none; color:var(--graphite); text-decoration:underline; text-transform:none; font-family:'Atlas',sans-serif; font-size:13px;}
  .hint{font-size:12px; color:var(--steel); line-height:1.5; margin:8px 0 0;}
  .row{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--hairline); cursor:pointer;}
  .row:first-of-type{border-top:none;}
  .row-main{flex:1;}
  .row-title{font-size:14px; font-weight:500; margin:0;}
  .row-sub{font-size:12px; color:var(--graphite); margin:2px 0 0;}
  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    color:var(--paper); background:var(--ink); border-radius:var(--r); padding:3px 7px;
  }
  .badge.done{background:none; border:1px solid var(--ink); color:var(--ink);}
  .row-menu-btn{
    font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--graphite); background:none; border:none;
    padding:4px 6px; cursor:pointer; flex-shrink:0;
  }
  .menu-popover{
    position:absolute; right:16px; background:var(--paper); border:1px solid var(--ink); border-radius:var(--r);
    z-index:10; min-width:150px;
  }
  .menu-popover button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px; font-size:13px;
    font-family:'Atlas',sans-serif; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--hairline);
  }
  .menu-popover button:last-child{border-bottom:none;}
  .menu-popover button.danger{color:var(--signal);}
  .link-box{
    display:flex; align-items:center; gap:8px;
    background:var(--hairline); border-radius:var(--r); padding:10px 8px 10px 12px; margin-bottom:10px;
  }
  .link-box .link-text{
    flex:1; min-width:0; font-family:'IBM Plex Mono',monospace; font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .link-copy-btn{
    background:none; border:none; padding:6px; cursor:pointer; flex-shrink:0; color:var(--ink);
    display:flex; align-items:center;
  }
  .detail{background:var(--hairline); border-radius:var(--r); padding:12px; font-size:13px; line-height:1.9; margin:10px 0;}
  .back{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--graphite); cursor:pointer; display:inline-block; margin-bottom:14px; text-decoration:underline;}
  .banner{background:#E1F5EE; border-radius:8px; padding:12px 14px; margin-bottom:16px;}
  .banner p{font-size:13px; color:#085041; margin:0; line-height:1.5;}
  .toast{font-size:12px; color:var(--graphite); margin-top:8px;}
  .center{text-align:center;}
  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:56px 20px; gap:10px;
  }
  .empty-state svg{margin-bottom:4px;}
  .empty-state p.empty-title{font-size:15px; font-weight:500; margin:0;}
  .empty-state p.empty-hint{font-size:12px; color:var(--graphite); margin:0;}
</style>

var STORE_KEY = 'gb_clients';
function loadClients(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e){ return []; } }

function getClient(id){ return loadClients().find(function(c){ return c.id === id; }); }
function upsertClient(client){
  var list = loadClients();
  var idx = list.findIndex(function(c){ return c.id === client.id; });
  if (idx >= 0) list[idx] = client; else list.push(client);
  saveClients(list);
}

function renderMechanicList(){
  var clients = loadClients().filter(function(c){ return !c.archived; });
  var rows = clients.map(function(c){
    var vehicleLine = c.vehicle ? (c.vehicle.make + ' ' + c.vehicle.model) : 'No vehicle yet';
    var badge;
    if (c.status === 'completed') badge = '<span class="badge done">Done</span>';
    else if (c.status === 'revoked') badge = '<span class="badge" style="background:var(--steel);">Revoked</span>';
    else badge = '<span class="badge">Pending</span>';

    var menu = '';
    if (openMenuId === c.id) {
      var items = '';
      if (c.status !== 'completed' && c.status !== 'revoked') {
        items += '<button onclick="event.stopPropagation(); revokeClient(\'' + c.id + '\')">Revoke link</button>';
      }
      items += '<button class="danger" onclick="event.stopPropagation(); archiveClient(\'' + c.id + '\')">Archive client</button>';
      menu = '<div class="menu-popover" onclick="event.stopPropagation();">' + items + '</div>';
    }

    return '<div class="row" style="position:relative;" onclick="openClientLink(\'' + c.id + '\')">' +
      '<div class="row-main"><p class="row-title">' + esc(c.name) + '</p><p class="row-sub">' + esc(c.phone || '') + ' &middot; ' + esc(vehicleLine) + '</p></div>' +
      badge +
      '<button class="row-menu-btn" onclick="event.stopPropagation(); toggleRowMenu(\'' + c.id + '\')">&#8942;</button>' +
      menu +
    '</div>';
  }).join('');
  go(
    '<p class="eyebrow center">' + esc(SHOP_NAME) + ' &middot; Mechanic</p>' +
    '<h1 class="title">Clients</h1>' +
    '<hr class="rule">' +
    (clients.length
      ? '<div class="card" style="min-height:auto;">' + rows + '</div>'
      : '<div class="empty-state">' + CAR_ILLUSTRATION + '<p class="empty-title">No clients yet</p><p class="empty-hint">Add your first client to get started</p></div>'
    ) +
    stickyFooter('<button class="btn btn-primary" onclick="renderAddClient()">Add client</button>')
  );
}

function toggleRowMenu(id){
  openMenuId = (openMenuId === id) ? null : id;
  renderMechanicList();
}
function revokeClient(id){
  if (!confirm('Revoke this client\'s link? They won\'t be able to use it to onboard.')) return;
  var client = getClient(id);
  client.status = 'revoked';
  client.revokedAt = Date.now();
  upsertClient(client);
  openMenuId = null;
  renderMechanicList();
}
function archiveClient(id){
  if (!confirm('Archive this client? They\'ll be hidden from the list, but their data is kept.')) return;
  var client = getClient(id);
  client.archived = true;
  upsertClient(client);
  openMenuId = null;
  renderMechanicList();
}

var COPY_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">' +
  '<rect x="5.5" y="5.5" width="8" height="8" rx="1" style="stroke:var(--ink);stroke-width:1.3;"/>' +
  '<path d="M3.5 10.5V3.5A1 1 0 0 1 4.5 2.5H11" style="stroke:var(--ink);stroke-width:1.3;fill:none;"/>' +
'</svg>';

function openClientLink(id, justOpenedWhatsApp){
  var url = baseUrl() + '?client=' + id;
  var intro = justOpenedWhatsApp
    ? 'We opened WhatsApp with the link ready to send. If it didn\'t open, copy the link below instead.'
    : 'Open this on the client\'s phone, or tap below to preview it yourself.';
  go(
    '<span class="back" onclick="renderMechanicList()">&#8249; Clients</span>' +
    '<h1 class="title">Client link</h1>' +
    '<p class="sub">' + intro + '</p>' +
    '<div class="link-box"><span class="link-text" id="linkBox">' + esc(url) + '</span><button class="link-copy-btn" onclick="copyLink()" aria-label="Copy link">' + COPY_ICON + '</button></div>' +
    '<p class="toast" id="copyToast"></p>' +
    stickyFooter('<a href="?client=' + id + '" style="text-decoration:none;display:block;"><button class="btn btn-primary" style="width:100%;">Open as this client</button></a>')
  );
}
function copyLink(){
  var text = document.getElementById('linkBox').textContent;
  navigator.clipboard.writeText(text).then(function(){
    document.getElementById('copyToast').textContent = 'Copied.';
  }).catch(function(){
    document.getElementById('copyToast').textContent = 'Could not copy \u2014 select and copy manually.';
  });
}

function renderAddClient(){
  go(
    '<span class="back" onclick="renderMechanicList()">&#8249; Clients</span>' +
    '<h1 class="title">Add client</h1>' +
    '<hr class="rule">' +
    '<div class="field"><label>Name</label><input id="ac-name" type="text" placeholder="Full name"></div>' +
    '<div class="field"><label>Phone</label><input id="ac-phone" type="text" placeholder="050-000-0000"></div>' +
    '<div class="field"><label>Email (optional)</label><input id="ac-email" type="text" placeholder="name@example.com"></div>' +
    stickyFooter('<button class="btn btn-primary" onclick="submitAddClient()">Send link</button>')
  );
}

/* Builds a wa.me link from a local Israeli number (e.g. 050-123-4567 -> 972501234567).
   If the number already looks international (starts with a country code, no leading 0),
   it's left as-is. */
function waLinkFor(phone, message){
  var digits = phone.replace(/[^0-9]/g, '');
  if (digits.charAt(0) === '0') digits = '972' + digits.slice(1);
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
}

function submitAddClient(){
  var name = document.getElementById('ac-name').value.trim();
  var phone = document.getElementById('ac-phone').value.trim();
  var email = document.getElementById('ac-email').value.trim();
  if (!name) { alert('Name is required'); return; }
  var client = { id: uid(), name: name, phone: phone, email: email, status: 'sent', createdAt: Date.now(), vehicle: null };
  upsertClient(client);

  var url = baseUrl() + '?client=' + client.id;
  var openedWhatsApp = false;
  if (phone) {
    var message = 'Hi ' + name + '! ' + SHOP_NAME + ' added you as a client \u2014 tap this link to register your car: ' + url;
    window.open(waLinkFor(phone, message), '_blank');
    openedWhatsApp = true;
  }
  openClientLink(client.id, openedWhatsApp);
}

/* =========================================================
   CLIENT VIEW
   ========================================================= */

function renderClientFlow(id){
  var client = getClient(id);
  if (!client) {
    go(
      '<h1 class="title">Link not recognized</h1>' +
      '<p class="sub">This browser doesn\'t have a record for this link. If you\'re testing, make sure you\'re opening it in the same browser you used as the mechanic.</p>'
    );
    return;
  }
  if (client.vehicle && client.status === 'completed') {
    renderClientDone(client);
  } else {
    renderWelcome(client);
  }
}

function renderWelcome(client){
  go(
    '<p class="eyebrow">Client view</p>' +
    '<div class="banner"><p>Welcome &mdash; you\u2019re connected with ' + esc(SHOP_NAME) + '.</p></div>' +
    '<p style="font-size:14px;line-height:2;color:var(--graphite);margin:0 0 16px;">' + esc(client.name) + '<br>' + esc(client.phone || '') + '</p>' +
    stickyFooter('<button class="btn btn-primary" onclick="renderAddCar(\'' + client.id + '\')">Register a vehicle</button>')
  );
}

function renderAddCar(id){
  go(
    '<p class="eyebrow">Client view</p>' +
    '<h1 class="title">Add your car</h1>' +
    '<div class="field"><label>Plate number</label><input id="plate-input" type="text" placeholder="123-45-678"></div>' +
    '<p class="hint" id="lookupHint"></p>' +
    stickyFooter(
      '<button class="btn btn-primary" id="lookupBtn" onclick="doLookup(\'' + id + '\')">Look up plate</button>' +
      '<button class="btn btn-tertiary" onclick="renderManualEntry(\'' + id + '\')">Add with photo instead</button>'
    )
  );
}

/* Real call to Israel's Ministry of Transport open vehicle registry (data.gov.il).
   No API key required. Resource covers private + commercial vehicles. */
function doLookup(id){
  var plateRaw = document.getElementById('plate-input').value.trim();
  var plate = plateRaw.replace(/[^0-9]/g, '');
  var hint = document.getElementById('lookupHint');
  var btn = document.getElementById('lookupBtn');
  if (!plate) { hint.textContent = 'Enter a plate number first.'; return; }
  btn.textContent = 'Looking up\u2026';
  btn.disabled = true;
  var url = 'https://data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3&filters=' +
            encodeURIComponent(JSON.stringify({ mispar_rechev: plate }));

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var records = (data && data.result && data.result.records) || [];
      if (records.length === 0) {
        hint.textContent = 'No match found in the registry.';
        setTimeout(function(){ renderManualEntry(id); }, 600);
        return;
      }
      var rec = records[0];
      var vehicle = {
        plate: plate,
        make: rec.tozeret_nm || '',
        model: rec.degem_nm || '',
        year: rec.shnat_yitzur || '',
        color: rec.tzeva_rechev || '',
        engine: rec.sug_delek_nm || rec.delek_nm || ''
      };
      renderConfirm(id, vehicle, false);
    })
    .catch(function(err){
      hint.textContent = 'Could not reach the registry (' + err.message + '). Falling back to manual entry.';
      setTimeout(function(){ renderManualEntry(id); }, 900);
    });
}

function renderManualEntry(id){
  go(
    '<p class="eyebrow">Client view</p>' +
    '<h1 class="title">We couldn\u2019t get this automatically</h1>' +
    '<p class="sub" style="text-transform:none;">Enter the details below.</p>' +
    '<div class="field"><label>Make</label><input id="m-make" type="text" placeholder="Toyota"></div>' +
    '<div class="field"><label>Model</label><input id="m-model" type="text" placeholder="Corolla"></div>' +
    '<div class="field"><label>Year</label><input id="m-year" type="text" placeholder="2019"></div>' +
    '<div class="field"><label>Color</label><input id="m-color" type="text" placeholder="White"></div>' +
    stickyFooter('<button class="btn btn-primary" onclick="submitManual(\'' + id + '\')">Continue</button>')
  );
}
function submitManual(id){
  var vehicle = {
    plate: '', 
    make: document.getElementById('m-make').value.trim(),
    model: document.getElementById('m-model').value.trim(),
    year: document.getElementById('m-year').value.trim(),
    color: document.getElementById('m-color').value.trim(),
    engine: ''
  };
  renderConfirm(id, vehicle, true);
}

function renderConfirm(id, vehicle, manual){
  pendingVehicle = vehicle;
  go(
    '<p class="eyebrow">Client view</p>' +
    '<h1 class="title">' + (manual ? 'Confirm your car\u2019s details' : 'We found your car') + '</h1>' +
    '<div class="detail">' +
      'Make: ' + esc(vehicle.make) + '<br>' +
      'Model: ' + esc(vehicle.model) + '<br>' +
      'Year: ' + esc(String(vehicle.year)) + '<br>' +
      'Color: ' + esc(vehicle.color) + '<br>' +
      (vehicle.engine ? 'Engine: ' + esc(vehicle.engine) + '<br>' : '') +
      (vehicle.plate ? 'Plate: ' + esc(vehicle.plate) : '') +
    '</div>' +
    stickyFooter('<button class="btn btn-primary" onclick="renderMileage(\'' + id + '\')">Save car</button>')
  );
}

function renderMileage(id){
  go(
    '<p class="eyebrow">Client view</p>' +
    '<h1 class="title">Current mileage</h1>' +
    '<p class="sub" style="text-transform:none;">This tells us exactly when your next service is due. You\u2019ll find it on your dashboard, next to the speedometer.</p>' +
    '<div class="field"><input id="mileage-input" type="text" placeholder="84,200 km"></div>' +
    stickyFooter('<button class="btn btn-primary" onclick="submitMileage(\'' + id + '\')">Save vehicle</button>')
  );
}
function submitMileage(id){
  var vehicle = pendingVehicle || {};
  vehicle.mileage = document.getElementById('mileage-input').value.trim();
  var client = getClient(id);
  client.vehicle = vehicle;
  client.status = 'completed';
  upsertClient(client);
  pendingVehicle = null;
  renderClientDone(client);
}

function renderClientDone(client){
  var v = client.vehicle || {};
  go(
    '<div class="center" style="padding:10px 0;">' +
      '<div style="width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;margin:0 auto 10px;"></div>' +
      '<h1 class="title">Your ' + esc(v.make || '') + ' ' + esc(v.model || '') + ' is all set</h1>' +
    '</div>' +
    '<hr class="rule">' +
    '<p class="sub" style="text-transform:none;">Install GarageBoard to see your service history, get maintenance reminders, and request appointments.</p>' +
    '<p class="hint">On iPhone: tap Share, then \u201cAdd to Home Screen.\u201d On Android: tap the menu, then \u201cInstall app.\u201d</p>'
  );
}

/* ---------- utility ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- boot ---------- */
if (clientId) {
  renderClientFlow(clientId);
} else {
  renderMechanicList();
}
</script>
